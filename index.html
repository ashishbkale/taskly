<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taskly</title>
    <script>
      // Runs before first paint so a dark theme doesn't flash light. It is a
      // separate classic script because it must run before the module bundle
      // and can't import modules, so 'taskly-theme' and 'dark' are hardcoded.
      // Source of truth: THEME_STORAGE_KEY and DARK_CLASS in src/theme.ts.
      // Keep these values and this logic in sync with that file.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('taskly-theme')
        } catch (e) {}
        var systemDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (saved !== 'light' && systemDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
